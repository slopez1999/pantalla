<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla Quifatex</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; width: 100vw; height: 100vh; overflow: hidden; cursor: none; }
  #container { width: 100%; height: 100%; position: relative; }
  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .slide.active { opacity: 1; }
  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #progress {
    position: fixed;
    bottom: 0; left: 0;
    height: 5px;
    background: #e02020;
    width: 0%;
    z-index: 999;
  }
  #indicator {
    position: fixed;
    top: 12px; right: 16px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-family: sans-serif;
    font-size: 14px;
    padding: 5px 12px;
    border-radius: 20px;
    z-index: 999;
  }
</style>
</head>
<body>
<div id="container">
  <div class="slide active" data-type="image">
    <img src="https://slopez1999.github.io/pantalla/tv4k_06.jpg" alt="">
  </div>
  <div class="slide" data-type="image">
    <img src="https://slopez1999.github.io/pantalla/tv4k_03.jpg" alt="">
  </div>
</div>
<div id="progress"></div>
<div id="indicator"></div>
<script>
  const slides = document.querySelectorAll('.slide');
  const progress = document.getElementById('progress');
  const indicator = document.getElementById('indicator');
  const DURATION = 20000;
  let current = 0;
  let startTime = null;
  let animFrame = null;
  function showSlide(index) {
    slides.forEach((s, i) => s.classList.toggle('active', i === index));
    indicator.textContent = '🖼️ Imagen ' + (index + 1) + ' / ' + slides.length;
    startTime = performance.now();
    animateProgress();
  }
  function animateProgress() {
    cancelAnimationFrame(animFrame);
    function step(now) {
      const pct = Math.min(((now - startTime) / DURATION) * 100, 100);
      progress.style.width = pct + '%';
      if (pct < 100) {
        animFrame = requestAnimationFrame(step);
      } else {
        progress.style.width = '0%';
        current = (current + 1) % slides.length;
        showSlide(current);
      }
    }
    animFrame = requestAnimationFrame(step);
  }
  document.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    }
  });
  showSlide(0);
</script>
</body>
</html>
